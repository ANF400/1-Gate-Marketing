<script>
    const scriptURL = 'SESUAIKAN_DENGAN_URL_GAS_KAMU';

    firebase.initializeApp({
        apiKey: "AIzaSyDBvhpl4FtPcQf54t5h_o9sFQWAEApTom0", // Pastikan API Key ini aman
        authDomain: "gate-marketing.firebaseapp.com",
        projectId: "gate-marketing"
    });

    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();
    let currentGps = null;

    // Objek Modul Pelaporan
    const reportingModules = {
        KOL_Affiliate: [
            { label: "Jumlah KOL Baru", type: "number", id: "kolBaru" },
            { label: "Jumlah KOL Aktif", type: "number", id: "kolAktif" },
            { label: "Total GMV (Rp)", type: "number", id: "gmv" }
        ],
        Merchandiser_Display: [
            { label: "Jumlah Toko Dikunjungi", type: "number", id: "tokoKunjungan" },
            { label: "Jumlah Display Baru", type: "number", id: "displayBaru" }
        ],
        Content_Creator: [
            { label: "Jumlah Konten Dibuat", type: "number", id: "konten" },
            { label: "Total Views", type: "number", id: "view" }
        ]
        // Tambahkan divisi lain di sini sesuai kebutuhan
    };

    // Fungsi Render Form Dinamis
    document.getElementById('posisi').addEventListener('change', function() {
        const container = document.getElementById('dynamicForm');
        const selected = this.value;
        container.innerHTML = ""; // Reset

        if (reportingModules[selected]) {
            reportingModules[selected].forEach(field => {
                const div = document.createElement('div');
                div.className = "mb-3";
                div.innerHTML = `
                    <label>${field.label.toUpperCase()}</label>
                    <input type="${field.type}" id="${field.id}" class="form-control dyn-input" required>
                `;
                container.appendChild(div);
            });
        }
    });

    function checkGPS() {
        const gpsAlert = document.getElementById('gpsAlert');
        const submitBtn = document.getElementById('submitBtn');

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    currentGps = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    gpsAlert.innerText = "LOKASI TERKUNCI";
                    gpsAlert.className = "gps-status gps-on";
                    submitBtn.disabled = false;
                    submitBtn.innerText = "KIRIM LAPORAN SEKARANG";
                },
                err => {
                    currentGps = null;
                    gpsAlert.innerText = "GPS BELUM AKTIF / IZIN DITOLAK";
                    gpsAlert.className = "gps-status gps-off";
                    submitBtn.disabled = true;
                },
                { enableHighAccuracy: true }
            );
        }
    }

    // Auth State
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('loginSection').classList.add('d-none');
            document.getElementById('formSection').classList.remove('d-none');
            document.getElementById('userImg').src = user.photoURL;
            // Perbaikan Backticks di sini:
            document.getElementById('userDetails').innerHTML = `<b>${user.displayName}</b><br>${user.email}`;
            document.getElementById('staffNameInput').value = user.displayName;
            checkGPS();
        } else {
            document.getElementById('loginSection').classList.remove('d-none');
            document.getElementById('formSection').classList.add('d-none');
        }
    });

    document.getElementById('loginBtn').onclick = () => auth.signInWithPopup(provider);
    document.getElementById('logoutBtn').onclick = () => auth.signOut();

    const fileToBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
    });

    document.getElementById('reportForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        btn.disabled = true; btn.innerText = "MENGIRIM...";

        // Kumpulkan data tambahan dari form dinamis
        const extraData = {};
        document.querySelectorAll('.dyn-input').forEach(input => {
            extraData[input.id] = input.value;
        });
        
        try {
            const foto = document.getElementById('fotoFile').files[0];
            const dok = document.getElementById('dokumenFile').files[0];

            const payload = {
                nama: document.getElementById('staffNameInput').value,
                email: auth.currentUser.email,
                posisi: document.getElementById('posisi').value,
                aktivitas: document.getElementById('aktivitas').value,
                lokasi: currentGps,
                extraFields: JSON.stringify(extraData), // Kirim data dinamis sebagai JSON string
                fotoData: await fileToBase64(foto),
                fotoName: foto.name,
                dokData: dok ? await fileToBase64(dok) : null,
                dokName: dok ? dok.name : null
            };

            const res = await fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors', // Penting untuk Apps Script jika tidak pakai library khusus
                body: JSON.stringify(payload) 
            });

            status.className = "alert alert-success mt-3";
            status.innerText = "LAPORAN BERHASIL TERKIRIM!";
            document.getElementById('reportForm').reset();
            document.getElementById('dynamicForm').innerHTML = "";
        } catch (err) {
            status.className = "alert alert-danger mt-3";
            status.innerText = "Terjadi kesalahan saat mengirim.";
        } finally {
            btn.disabled = false;
            btn.innerText = "KIRIM LAPORAN SEKARANG";
            status.classList.remove('d-none');
        }
    };
</script>
