<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEVAL Reporting System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --meval-orange: #FF7F00; --meval-yellow: #FFD700; }
        body { 
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; 
            font-family: 'Segoe UI', sans-serif; position: relative;
            background: linear-gradient(135deg, var(--meval-orange) 0%, var(--meval-yellow) 100%);
            overflow-x: hidden;
        }
        body::before {
            content: "MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL";
            position: fixed; top: 0; left: 0; width: 150%; height: 150%; z-index: 0;
            font-size: 2.5rem; font-weight: 900; color: rgba(255, 255, 255, 0.1);
            transform: rotate(-20deg); pointer-events: none;
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.96); border-radius: 25px; padding: 30px; 
            width: 100%; max-width: 500px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
            position: relative; z-index: 1; margin: 20px;
        }
        .btn-meval { 
            background: #FF4500; color: white; font-weight: bold; border-radius: 12px; 
            padding: 14px; width: 100%; border: none; transition: 0.3s;
        }
        .btn-meval:hover:not(:disabled) { background: #E63E00; transform: translateY(-2px); }
        .section-divider { border-top: 2px dashed #ddd; margin: 25px 0; position: relative; }
        .section-divider span { 
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%); 
            background: #fff; padding: 0 10px; font-size: 0.7rem; color: #999; font-weight: bold; 
        }
        label { font-size: 0.75rem; font-weight: 700; color: #444; margin-bottom: 5px; display: block; }
        .form-control, .form-select { border-radius: 8px; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="glass-card">
    <div id="loginSection" class="text-center">
        <h5 class="fw-bold mb-4">MEVAL REPORTING SYSTEM</h5>
        <button id="loginBtn" class="btn btn-outline-dark w-100 p-3">Sign in with Google</button>
    </div>

    <div id="formSection" class="d-none">
        <div id="userDetails" class="small mb-3 p-2 bg-light rounded"></div>
        <div id="gpsAlert" class="alert py-2 text-center small fw-bold">MENCARI GPS...</div>

        <form id="reportForm">
            <label>DIVISI / POSISI</label>
            <select id="posisi" class="form-select" required>
                <option value="" disabled selected>Pilih Divisi...</option>
                <option value="Admin_Ecommerce">Admin Ecommerce</option>
                <option value="Branding_Promotion">Branding & Promotion</option>
                <option value="Graphic_Designer">Graphic Designer</option>
                <option value="KOL_Affiliate">KOL & Affiliate</option>
                <option value="Socmed_Specialist">Socmed Specialist</option>
                <option value="Trade_Marketing_Sp">Trade Marketing Specialist</option>
                <option value="Videographer">Videographer</option>
                </select>

            <div id="dynamicForm"></div>

            <div class="section-divider"><span>UMUM</span></div>
            <label>DETAIL AKTIVITAS</label>
            <textarea id="aktivitas" class="form-control" rows="3" required></textarea>
            
            <label>FOTO KEGIATAN UTAMA (WAJIB)</label>
            <input type="file" id="fotoUtama" class="form-control" accept="image/*" required>

            <button type="submit" id="submitBtn" class="btn-meval" disabled>MENUNGGU GPS...</button>
        </form>
        <div id="status" class="mt-3 text-center small d-none"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyF9tXkVZ_A9TnF2yDwN_4WJQDOL1unch50-SaLMDkB411dM3IUv8HdJzNrOwtpueSFog/exec';

    firebase.initializeApp({
        apiKey: "AIzaSyDBvhpl4FtPcQf54t5h_o9sFQWAEApTom0",
        authDomain: "gate-marketing.firebaseapp.com",
        projectId: "gate-marketing"
    });

    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();
    let currentGps = "";

    const configForm = {
        KOL_Affiliate: [
            { label: "Jumlah KOL & Affiliator Lama", type: "number", id: "kol_lama" },
            { label: "Jumlah KOL & Affiliator Baru", type: "number", id: "kol_baru" },
            { label: "Bukti Data KOL (Upload)", type: "file", id: "file_kol" },
            { label: "Biaya Spending Iklan (Rp)", type: "number", id: "spending" },
            { label: "Total Engagement", type: "number", id: "engagement" },
            { label: "Screenshot Analytics", type: "file", id: "file_analytics" },
            { label: "Total GMV", type: "number", id: "gmv" },
            { label: "Screenshot Dashboard Affiliate", type: "file", id: "file_aff_dash" },
            { label: "Jumlah Order Tiap Platform", type: "text", id: "order_platform" },
            { label: "Jumlah Klik Link", type: "number", id: "klik_link" },
            { label: "Screenshot Penjualan Platform", type: "file", id: "file_sales_dash" },
            { label: "Planning Bulan Depan", type: "textarea", id: "planning" }
        ]
    };

    document.getElementById('posisi').onchange = function() {
        const container = document.getElementById('dynamicForm');
        container.innerHTML = '<div class="section-divider"><span>DATA SPESIFIK POSISI</span></div>';
        const fields = configForm[this.value];
        if (fields) {
            fields.forEach(f => {
                let input = `<input type="${f.type}" id="${f.id}" class="form-control dyn-input${f.type === 'file' ? '-file' : ''}" required>`;
                if (f.type === 'textarea') input = `<textarea id="${f.id}" class="form-control dyn-input" rows="2" required></textarea>`;
                container.innerHTML += `<div class="mb-3"><label>${f.label.toUpperCase()}</label>${input}</div>`;
            });
        }
    };

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve({ data: reader.result.split(',')[1], name: file.name });
        reader.onerror = error => reject(error);
    });

    document.getElementById('reportForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        btn.disabled = true; btn.innerText = "MENGIRIM DATA & FILE...";

        try {
            const payload = {
                nama: auth.currentUser.displayName,
                email: auth.currentUser.email,
                posisi: document.getElementById('posisi').value,
                aktivitas: document.getElementById('aktivitas').value,
                lokasi: currentGps,
                extraData: {},
                files: []
            };

            document.querySelectorAll('.dyn-input').forEach(input => {
                payload.extraData[input.id] = input.value;
            });

            const fileInputs = [document.getElementById('fotoUtama'), ...document.querySelectorAll('.dyn-input-file')];
            for (let input of fileInputs) {
                if (input.files[0]) {
                    const fileObj = await toBase64(input.files[0]);
                    payload.files.push({ field: input.id, ...fileObj });
                }
            }

            const response = await fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });

            status.innerHTML = '<div class="alert alert-success">LAPORAN TERKIRIM!</div>';
            status.classList.remove('d-none');
            document.getElementById('reportForm').reset();
        } catch (err) {
            status.innerHTML = '<div class="alert alert-danger">Gagal mengirim. Pastikan Apps Script aktif.</div>';
            status.classList.remove('d-none');
        } finally {
            btn.disabled = false; btn.innerText = "KIRIM LAPORAN SEKARANG";
        }
    };

    function checkGPS() {
        navigator.geolocation.getCurrentPosition(pos => {
            currentGps = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
            document.getElementById('gpsAlert').className = "alert py-2 text-center small fw-bold alert-success";
            document.getElementById('gpsAlert').innerText = "LOKASI TERKUNCI";
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').innerText = "KIRIM LAPORAN SEKARANG";
        });
    }
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('loginSection').classList.add('d-none');
            document.getElementById('formSection').classList.remove('d-none');
            document.getElementById('userDetails').innerText = user.email;
            checkGPS();
        }
    });
    document.getElementById('loginBtn').onclick = () => auth.signInWithPopup(provider);
</script>
</body>
</html>
