<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEVAL Reporting System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
    --meval-orange: #FF7F00;
    --meval-yellow: #FFD700;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    position: relative;
    background: linear-gradient(135deg, var(--meval-orange) 0%, var(--meval-yellow) 100%);
    overflow-x: hidden;
}

body::before {
    content: "MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL MEVAL";
    position: fixed;
    top: 0;
    left: 0;
    width: 150%;
    height: 150%;
    z-index: 0;
    font-size: 2.5rem;
    font-weight: 900;
    color: rgba(255, 255, 255, 0.12);
    transform: rotate(-20deg);
    pointer-events: none;
}

.glass-card {
    background: rgba(255, 255, 255, 0.96);
    border-radius: 25px;
    padding: 30px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    position: relative;
    z-index: 1;
}

.logo-img {
    max-width: 150px;
    display: block;
    margin: 0 auto 20px;
}

.btn-meval {
    background: #FF4500;
    color: white;
    font-weight: bold;
    border-radius: 12px;
    border: none;
    padding: 14px;
    width: 100%;
}

.btn-google {
    background: white;
    border: 1px solid #ddd;
    padding: 12px;
    border-radius: 12px;
    width: 100%;
}

.d-none {
    display: none !important;
}
</style>
</head>

<body>

<div class="glass-card">

<img src="logo-web-300x92-1.jpg" class="logo-img">

<!-- LOGIN -->
<div id="loginSection" class="text-center">
    <h5>REPORTING SYSTEM</h5>
    <button id="loginBtn" class="btn-google">Login Google</button>
</div>

<!-- FORM -->
<div id="formSection" class="d-none">

<div id="gpsAlert">MENCARI GPS...</div>

<form id="reportForm">

<select id="posisi" class="form-select" required>
    <option value="" disabled selected>Pilih Divisi...</option>
    <option value="Admin_Ecommerce">Admin E-commerce</option>
    <option value="Branding_Promotion">Branding & Promotion</option>
    <option value="Socmed_Specialist">Social Media Specialist</option>
    <option value="Content_Creator">Content Creator</option>
    <option value="Design_Graphic">Design Graphic</option>
    <option value="Ecommerce_Specialist">E-commerce Specialist</option>
    <option value="KOL_Affiliate">KOL & Affiliate</option>
    <option value="Merchandiser_Display">Merchandiser Display</option>
    <option value="TL_Event">TL Event</option>
    <option value="Trade_Marketing_Specialist">Trade Marketing Specialist</option>
</select>

<input type="text" id="staffNameInput" class="form-control mt-2" required>

<div id="dynamicForm"></div>

<textarea id="aktivitas" class="form-control mt-2" required></textarea>

<input type="file" id="fotoFile" class="form-control mt-2" required>
<input type="file" id="dokumenFile" class="form-control mt-2">

<button type="submit" id="submitBtn" disabled>KIRIM</button>

</form>

<div id="status" class="d-none"></div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>

<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbyF9tXkVZ_A9TnF2yDwN_4WJQDOL1unch50-SaLMDkB411dM3IUv8HdJzNrOwtpueSFog/exec';

firebase.initializeApp({
    apiKey: "AIzaSyDBvhpl4FtPcQf54t5h_o9sFQWAEApTom0",
    authDomain: "gate-marketing.firebaseapp.com",
    projectId: "gate-marketing"
});

const auth = firebase.auth();
const provider = new firebase.auth.GoogleAuthProvider();

let currentGps = null;

// GPS
function checkGPS() {
    const submitBtn = document.getElementById('submitBtn');

    navigator.geolocation.getCurrentPosition(
        pos => {
            currentGps = "OK";
            submitBtn.disabled = false;
        },
        () => {
            submitBtn.disabled = true;
        }
    );
}

setInterval(checkGPS, 4000);

// LOGIN
document.getElementById('loginBtn').onclick = () => {
    auth.signInWithPopup(provider);
};

auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById('loginSection').classList.add('d-none');
        document.getElementById('formSection').classList.remove('d-none');

        document.getElementById('staffNameInput').value = user.displayName;
    }
});

// FILE CONVERT
const fileToBase64 = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = error => reject(error);
});

// SUBMIT
document.getElementById('reportForm').onsubmit = async (e) => {
    e.preventDefault();

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;

    try {
        const foto = document.getElementById('fotoFile').files[0];
        const dok = document.getElementById('dokumenFile').files[0];

        const payload = {
            nama: document.getElementById('staffNameInput').value,
            email: auth.currentUser.email,
            posisi: document.getElementById('posisi').value,
            aktivitas: document.getElementById('aktivitas').value,
            lokasi: currentGps,
            fotoData: await fileToBase64(foto),
            fotoName: foto.name,
            dokData: dok ? await fileToBase64(dok) : null,
            dokName: dok ? dok.name : null
        };

        const res = await fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.result === 'success') {
            alert("Berhasil!");
            document.getElementById('reportForm').reset();
        }

    } catch (err) {
        alert("Gagal kirim");
    }

    btn.disabled = false;
};
</script>

</body>
</html>
