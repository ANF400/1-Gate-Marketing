<!-- HANYA BAGIAN SCRIPT YANG DIUPDATE -->

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyF9tXkVZ_A9TnF2yDwN_4WJQDOL1unch50-SaLMDkB411dM3IUv8HdJzNrOwtpueSFog/exec';

    firebase.initializeApp({
        apiKey: "AIzaSyDBvhpl4FtPcQf54t5h_o9sFQWAEApTom0",
        authDomain: "gate-marketing.firebaseapp.com",
        projectId: "gate-marketing"
    });

    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();
    let currentGps = null;

    function checkGPS() {
        const gpsAlert = document.getElementById('gpsAlert');
        const submitBtn = document.getElementById('submitBtn');

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    currentGps = "https://www.google.com/maps?q=" + lat + "," + lon;
                    
                    gpsAlert.innerText = "LOKASI TERKUNCI";
                    gpsAlert.className = "gps-status gps-on";
                    submitBtn.disabled = false;
                    submitBtn.innerText = "KIRIM LAPORAN SEKARANG";
                },
                err => {
                    currentGps = null;
                    gpsAlert.innerText = "GPS BELUM AKTIF";
                    gpsAlert.className = "gps-status gps-off";
                    submitBtn.disabled = true;
                }
            );
        }
    }

    setInterval(checkGPS, 4000); 

    document.getElementById('loginBtn').onclick = () => {
        auth.signInWithPopup(provider).then(() => checkGPS());
    };

    document.getElementById('logoutBtn').onclick = () => auth.signOut();

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('loginSection').classList.add('d-none');
            document.getElementById('formSection').classList.remove('d-none');
            document.getElementById('staffNameInput').value = user.displayName;
            checkGPS();
        } else {
            document.getElementById('loginSection').classList.remove('d-none');
            document.getElementById('formSection').classList.add('d-none');
        }
    });

    const fileToBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
    });

    // =========================
    // MODULE KPI (ASLI + TETAP)
    // =========================
    const reportingModules = {
        KOL_Affiliate: [
            { label: "Jumlah KOL Baru", type: "number", id: "kolBaru" },
            { label: "Jumlah KOL Aktif", type: "number", id: "kolAktif" },
            { label: "Total Engagement", type: "number", id: "engagement" },
            { label: "Total GMV", type: "number", id: "gmv" }
        ],
        Merchandiser_Display: [
            { label: "Jumlah Toko Dikunjungi", type: "number", id: "tokoKunjungan" },
            { label: "Display Diperbaiki", type: "number", id: "displayFix" },
            { label: "Display Baru", type: "number", id: "displayBaru" }
        ],
        Content_Creator: [
            { label: "Jumlah Konten Dibuat", type: "number", id: "konten" },
            { label: "Total View", type: "number", id: "view" },
            { label: "Total Engagement", type: "number", id: "engagement" }
        ]
    };

    // =========================
    // 🔥 TAMBAHAN DYNAMIC FORM
    // =========================
    document.getElementById('posisi').addEventListener('change', function () {
        renderDynamicForm(this.value);
    });

    function renderDynamicForm(posisi) {
        const container = document.getElementById('dynamicForm');
        container.innerHTML = '';

        if (!reportingModules[posisi]) return;

        let html = `<div class="mb-3"><label>SUMMARY KPI REPORT</label></div>`;

        reportingModules[posisi].forEach(item => {
            html += `
            <div class="mb-2">
                <label>${item.label}</label>
                <input type="${item.type}" id="${item.id}" class="form-control" required>
            </div>
            `;
        });

        // KHUSUS KOL
        if (posisi === "KOL_Affiliate") {
            html += `
            <hr>
            <div class="mb-2">
                <label>Jumlah Campaign</label>
                <input type="number" id="campaign" class="form-control">
            </div>

            <div class="mb-2">
                <label>Conversion Rate (%)</label>
                <input type="number" id="conversion" class="form-control">
            </div>

            <div class="mb-2">
                <label>Top KOL</label>
                <input type="text" id="topKol" class="form-control">
            </div>

            <div class="mb-2">
                <label>Link Evidence</label>
                <input type="text" id="linkEvidence" class="form-control">
            </div>
            `;
        }

        container.innerHTML = html;
    }

    // =========================
    // SUBMIT (DITAMBAH DINAMIC)
    // =========================
    document.getElementById('reportForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;

        try {
            const foto = document.getElementById('fotoFile').files[0];

            const payload = {
                nama: document.getElementById('staffNameInput').value,
                email: auth.currentUser.email,
                posisi: document.getElementById('posisi').value,
                aktivitas: document.getElementById('aktivitas').value,
                lokasi: currentGps,
                fotoData: await fileToBase64(foto),
                fotoName: foto.name
            };

            // 🔥 ambil dynamic input
            const dynamicInputs = document.querySelectorAll('#dynamicForm input');
            dynamicInputs.forEach(input => {
                payload[input.id] = input.value;
            });

            await fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) });

            alert("Laporan berhasil dikirim!");
            document.getElementById('reportForm').reset();
            document.getElementById('dynamicForm').innerHTML = '';

        } catch (err) {
            alert("Gagal kirim");
        }

        btn.disabled = false;
    };
</script>
