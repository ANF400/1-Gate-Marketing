<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEVAL Reporting System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #FF7F00, #FFD700);
            font-family: sans-serif;
        }

        .glass-card { 
            background: #fff; 
            border-radius: 20px; 
            padding: 25px; 
            width: 100%; 
            max-width: 450px; 
        }

        .btn-meval { 
            background: #FF4500; 
            color: white; 
            border-radius: 10px; 
            padding: 12px; 
            width: 100%; 
        }

        .d-none { display: none !important; }
    </style>
</head>

<body>

<div class="glass-card">

    <div id="loginSection" class="text-center">
        <h5>REPORTING SYSTEM</h5>
        <button id="loginBtn" class="btn btn-outline-dark">Login Google</button>
    </div>

    <div id="formSection" class="d-none">

        <form id="reportForm">

            <div class="mb-3">
                <label>DIVISI / POSISI</label>
                <select id="posisi" class="form-select" required>
                    <option value="">Pilih Posisi</option>
                    <option value="KOL_Affiliate">KOL & Affiliate</option>
                    <option value="Merchandiser_Display">Merchandiser Display</option>
                    <option value="Content_Creator">Content Creator</option>
                </select>
            </div>

            <div class="mb-3">
                <label>NAMA STAFF</label>
                <input type="text" id="staffNameInput" class="form-control" required>
            </div>

            <!-- DYNAMIC SECTION -->
            <div id="dynamicForm"></div>

            <div class="mb-3">
                <label>DETAIL AKTIVITAS</label>
                <textarea id="aktivitas" class="form-control"></textarea>
            </div>

            <div class="mb-3">
                <label>FOTO KEGIATAN</label>
                <input type="file" id="fotoFile" class="form-control" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-meval">
                KIRIM LAPORAN
            </button>

        </form>

    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>

<script>

// ================= FIREBASE =================
firebase.initializeApp({
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_DOMAIN"
});

const auth = firebase.auth();
const provider = new firebase.auth.GoogleAuthProvider();

document.getElementById('loginBtn').onclick = () => {
    auth.signInWithPopup(provider);
};

auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById('loginSection').classList.add('d-none');
        document.getElementById('formSection').classList.remove('d-none');
        document.getElementById('staffNameInput').value = user.displayName;
    }
});


// ================= KPI MODULE =================
const reportingModules = {

    KOL_Affiliate: [
        { label: "Jumlah KOL Baru", id: "kolBaru" },
        { label: "Jumlah KOL Aktif", id: "kolAktif" },
        { label: "Total Engagement", id: "engagement" },
        { label: "Total GMV", id: "gmv" }
    ],

    Merchandiser_Display: [
        { label: "Jumlah Toko Dikunjungi", id: "kunjungan" },
        { label: "Display Baru", id: "displayBaru" }
    ],

    Content_Creator: [
        { label: "Jumlah Konten", id: "konten" },
        { label: "Total View", id: "view" }
    ]
};


// ================= RENDER FORM =================
document.getElementById('posisi').addEventListener('change', function () {
    renderDynamicForm(this.value);
});

function renderDynamicForm(posisi) {
    const container = document.getElementById('dynamicForm');
    container.innerHTML = '';

    if (!reportingModules[posisi]) return;

    let html = `<hr><h6>SUMMARY KPI</h6>`;

    reportingModules[posisi].forEach(item => {
        html += `
        <div class="mb-2">
            <label>${item.label}</label>
            <input type="number" id="${item.id}" class="form-control" required>
        </div>
        `;
    });

    // KHUSUS KOL
    if (posisi === "KOL_Affiliate") {
        html += `
        <hr>
        <h6>Tambahan KPI KOL</h6>

        <div class="mb-2">
            <label>Jumlah Campaign</label>
            <input type="number" id="campaign" class="form-control">
        </div>

        <div class="mb-2">
            <label>Conversion Rate (%)</label>
            <input type="number" id="conversion" class="form-control">
        </div>

        <div class="mb-2">
            <label>Top KOL</label>
            <input type="text" id="topKol" class="form-control">
        </div>

        <div class="mb-2">
            <label>Link Evidence</label>
            <input type="text" id="linkEvidence" class="form-control">
        </div>
        `;
    }

    container.innerHTML = html;
}


// ================= SUBMIT =================
document.getElementById('reportForm').onsubmit = async (e) => {
    e.preventDefault();

    const payload = {
        nama: document.getElementById('staffNameInput').value,
        posisi: document.getElementById('posisi').value,
        aktivitas: document.getElementById('aktivitas').value
    };

    // ambil semua input dinamis
    const inputs = document.querySelectorAll('#dynamicForm input');
    inputs.forEach(input => {
        payload[input.id] = input.value;
    });

    console.log("DATA DIKIRIM:", payload);

    alert("Berhasil (cek console dulu)");
};

</script>

</body>
</html>
